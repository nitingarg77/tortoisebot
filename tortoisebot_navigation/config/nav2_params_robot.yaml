amcl:
  ros__parameters:
    use_sim_time: False
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False
    
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    # 20 ms, up from 10. On a Pi 4 alongside Cartographer the 100 Hz tick was
    # overrun hundreds of times a run; 50 Hz is still far above what a
    # 0.15 m/s robot needs.
    bt_loop_duration: 20
    default_server_timeout: 20
    # Groot's ZMQ publisher costs CPU on every tick; turn on only to debug
    # the behaviour tree.
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 0.25 m in 20 s, down from 0.5 m in 10 s. The motors are open loop
      # with no encoders: real speed is well below the commanded 0.15 m/s
      # (0.04 m/s average while exploring, 2026-09-25), and turning in place
      # covers no distance at all, so the stricter check abandoned 11 of 12
      # frontier goals as "Failed to make progress".
      required_movement_radius: 0.25
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Publishing every simulated trajectory is a debugging aid, not free.
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.4
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      # 10 x 20 = 200 trajectories per cycle, down from 20 x 100 = 2000 --
      # the biggest single CPU cost on the Pi. At max_vel_x 0.15 the linear
      # steps are still 1.5 cm, and 20 angular samples over +-1.5 rad/s are
      # 0.15 rad/s apart.
      vx_samples: 10
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.1
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      # 5 Hz update / 2 Hz publish, down from 10 / 10. At 0.15 m/s the robot
      # moves 3 cm between updates; the publish rate only feeds RViz.
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.1
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_persistence: 0.0
        combination_method: 1
        observation_sources: scan floor_scan
        scan:
          # Costmap layers live on a child node (e.g. local_costmap/local_costmap),
          # so a relative name here would resolve to <ns>/local_costmap/scan,
          # not <ns>/scan. This nav2 build has no joinWithParentNamespace to
          # correct that, so the namespace is substituted in literally by
          # ReplaceString at launch time. Empty namespace yields /scan.
          topic: <robot_namespace>/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.15
          obstacle_max_range: 4.5
          obstacle_min_range: 0.15
          decay_function: exponential
        floor_scan:
          # Camera-derived obstacles: the lidar cannot see the white fluted
          # panels in this building (measured: nothing returned in 55-80% of
          # scans head-on at 1.2 m). floor_scan.py finds where the floor ends
          # and publishes it as a scan. It only marks, never clears: it is a
          # narrow 53 deg fan that sees nothing closer than ~0.45 m, so it must
          # not be trusted to declare space free.
          topic: <robot_namespace>/floor_scan
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "LaserScan"
          obstacle_max_range: 2.5
          obstacle_min_range: 0.45
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: False
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.1
      resolution: 0.05
      track_unknown_space: true
      # No voxel_layer. It was configured with exactly the same observation
      # sources and ranges as obstacle_layer, and a single-plane lidar gives it
      # no vertical information to work with, so it marked the same cells twice
      # -- once flat, once across 16 z-levels -- and published a voxel grid
      # nothing subscribes to. On the real Pi the global costmap could not keep
      # up: planner_server ran at 1.6-5 Hz against its 20 Hz target, the
      # behaviour tree's compute_path_to_pose call timed out, FollowPath was
      # handed an empty path ("Resulting plan has 0 poses in it", 763 times in
      # one run), every goal aborted, and recovery cleared the whole costmap and
      # made the next rebuild slower still. The local costmap never had it.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # The voxel layer this replaces kept points down to z = -0.2 m, and the
        # default here is 0.0. A planar scan returns at the lidar's own height
        # (0.167 m) so nothing should come in below zero, but the margin is kept
        # so that a change to Cartographer's tracking_frame -- which once put
        # z = -0.110 into the published transform -- cannot silently start
        # dropping scans.
        min_obstacle_height: -0.2
        observation_sources: scan floor_scan
        scan:
          # Costmap layers live on a child node (e.g. local_costmap/local_costmap),
          # so a relative name here would resolve to <ns>/local_costmap/scan,
          # not <ns>/scan. This nav2 build has no joinWithParentNamespace to
          # correct that, so the namespace is substituted in literally by
          # ReplaceString at launch time. Empty namespace yields /scan.
          topic: <robot_namespace>/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.15
          obstacle_max_range: 2.5
          obstacle_min_range: 0.15
        floor_scan:
          # Camera-derived obstacles: the lidar cannot see the white fluted
          # panels in this building (measured: nothing returned in 55-80% of
          # scans head-on at 1.2 m). floor_scan.py finds where the floor ends
          # and publishes it as a scan. It only marks, never clears: it is a
          # narrow 53 deg fan that sees nothing closer than ~0.45 m, so it must
          # not be trusted to declare space free.
          topic: <robot_namespace>/floor_scan
          max_obstacle_height: 2.0
          clearing: False
          marking: True
          data_type: "LaserScan"
          obstacle_max_range: 2.5
          obstacle_min_range: 0.45
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # Cartographer publishes a probability, not a yes/no. Measured on the
        # real map: of 3150 wall cells, 55.7% sit at 51-64, 15.1% at 90-98, and
        # only 21 cells -- 0.7% -- reach 100. Nav2's defaults here are
        # trinary_costmap true with lethal_cost_threshold 100, which keeps those
        # 21 and turns every other wall cell into free space. The planner's only
        # remaining knowledge of walls was then the obstacle layer's live 2.5 m,
        # so it routed straight through anything further off and the controller
        # could not follow. Checked against the running costmap: 61.8% of
        # Cartographer's walls were marked free.
        #
        # 65 keeps 44.3% of wall cells as lethal outright, and trinary_costmap
        # false grades the rest rather than discarding them, so a cell at 51
        # still costs 199 of 254 and is avoided without being impassable. That
        # matters while mapping, when most walls are only half-confirmed.
        lethal_cost_threshold: 65
        trinary_costmap: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 2
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 1

# Limits mirror controller_server's own (max_vel_x 0.15, max_vel_theta 1.5,
# acc_lim_x 1.0, decel_lim_x -1.0, acc/decel_lim_theta 1.5/-1.5). Without this
# section the smoother falls back to nav2 defaults (0.50 m/s, 2.5 m/s^2), which
# are looser than the robot can do, so it would limit nothing.
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 1.5]
    min_velocity: [-0.15, 0.0, -1.5]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
