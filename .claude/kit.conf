# Read by claude-kit hooks (~/.claude/kit/hooks). Keep in step with CLAUDE.md.
# The robot work lives on frontier-exploration (85 commits ahead of upstream ros2-humble); treated as the protected integration branch.
DEFAULT_BRANCH="frontier-exploration"
# No auto-format: existing codebase, a bulk reformat would drown diffs.
FORMAT_CMD=""
# Errors only. Known 1 finding: vendored teleop_twist_keyboard.py `msvcrt` behind a win32 guard (F821).
LINT_CMD="ruff check --select E9,F63,F7,F82 {file}"
# PATH is forced to system python3 (has cv2/numpy/pytest/pyflakes); a venv python3 first on PATH makes navigation tests fail on `import cv2`.
TEST_CMD="env PATH=/usr/bin:/bin:\$PATH PYTHONDONTWRITEBYTECODE=1 ./run_tests.sh"
